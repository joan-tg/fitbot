name: Refresh uv lockfile

on:
  push:
    branches:
      - feature/vercel-qstash-webhook
    paths:
      - "pyproject.toml"
      - ".github/workflows/refresh-uv-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vercel-qstash-webhook
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Regenerate lockfile from pyproject.toml
        run: uv lock
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Update uv.lock dependencies"
          git push
