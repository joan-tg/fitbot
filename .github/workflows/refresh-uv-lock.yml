name: Temporary format reconcile fix

on:
  push:
    branches:
      - fix/calendar-backfill-within-hobby-function-limit
    paths:
      - ".github/workflows/refresh-uv-lock.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-backfill-within-hobby-function-limit
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - run: uvx ruff==0.17.5 format api/reconcile.py
      - name: Commit formatting
        run: |
          if git diff --quiet -- api/reconcile.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/reconcile.py
          git commit -m "Format reconciler calendar recovery"
          git push
