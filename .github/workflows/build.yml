name: Build

on:
  push:
  pull_request:
    branches: [ master ]

jobs:
  lint:
    name: Run Ruff checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check lint
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --select E4,E7,E9,F"
      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  frontend:
    name: Check dashboard JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript syntax
        run: node --check public/app.js
      - name: Test month-aware quota logic
        run: node tests/test_quota_month.cjs
      - name: Test compact simple view and safety indicators
        run: node tests/test_simple_view.cjs

  tests:
    name: Run complete test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: make docker/build
      - name: Run all tests
        run: make docker/tests
